[package]
name = "together-server"
version = "0.1.0"
edition = "2021"
authors = ["Together Contributors"]
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
description = "Backend server for Together - a private Discord alternative"

[lib]
name = "together_server"
path = "src/lib.rs"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace", "fs", "set-header"] }
governor = { version = "0.10", features = ["dashmap"] }
tower_governor = "0.8"

# Database
sqlx = { version = "0.9", features = [
    "postgres",
    "runtime-tokio",
    "tls-native-tls",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OpenAPI documentation
utoipa = { version = "6", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "10", features = ["axum"] }

# Async utilities
futures = "0.3"
bytes = "1"                  # Byte buffer type (used by multipart upload handler)
tokio-util = { version = "0.7", features = ["io"] }  # ReaderStream for streaming file downloads

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
thiserror = "2"
strum = { version = "0.28", features = ["derive"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum-prometheus = "0.10"

# Phase 2: Authentication and API
jsonwebtoken = { version = "12", features = ["rust_crypto"] } # JWT auth
bcrypt = "0.19"              # Password hashing
sha2 = "0.11"                # SHA-256 for refresh token hashing (deterministic)
base64 = "0.23"              # Base64 encoding for reset tokens
rand = "0.10"                 # Random number generation for tokens
validator = { version = "0.21", features = ["derive"] }  # Input validation
regex = "1"                  # Used by username format validator
once_cell = "1"              # Lazy-initialised statics (regex, config)
axum-extra = { version = "0.12", features = ["typed-header"] }  # Typed headers for auth
scraper = "0.29"             # HTML parsing for OG tag extraction
url = "2"                    # URL parsing (used by reqwest internally, now explicit)
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "charset", "http2", "system-proxy"] }  # HTTP client for link preview fetching; native-tls keeps the pre-0.13 TLS backend
urlencoding = "2"            # URL percent-encoding for Giphy search query
infer = "0.22"               # Magic-byte MIME type detection for uploaded files

# Phase 3+ dependencies (add as needed):
# tokio-tungstenite = "0.21"   # WebSocket (Phase 3)
# governor = "0.6"             # Rate limiting (Phase 2-3)
# webrtc = "0.9"               # Voice/video (Phase 4) - VERY HEAVY

# Server data export (ZIP archive)
zip = { version = "9", default-features = false, features = ["deflate"] }

# TURN server credentials (WebRTC NAT traversal)
hmac = "0.13"
sha1 = "0.11"

[dev-dependencies]
tokio-test = "0.4"
http-body-util = "0.1"   # BodyExt::collect() for reading response bodies in tests
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "tls-native-tls"] }
serial_test = "4"

[[bin]]
name = "together-server"
path = "src/main.rs"
